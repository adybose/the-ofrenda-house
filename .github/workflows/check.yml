# Checks the code on every push and pull request (spec 15). Nothing is deployed: the game is played
# locally. The tests mock Ollama and Piper, so neither is needed here.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: artifacts/
